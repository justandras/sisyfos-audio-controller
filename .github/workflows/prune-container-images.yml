name: Prune container images

permissions:
    contents: read
    packages: write

on:
    workflow_dispatch:
    schedule:
        - cron: '13 9 * * *'

jobs:
    prune-container-images:
        runs-on: ubuntu-latest
        steps:
            - name: Resolve package coordinates
              id: pkg
              run: |
                  owner="${{ github.repository_owner }}"
                  name="${{ github.event.repository.name }}"
                  echo "owner=${owner,,}" >> "$GITHUB_OUTPUT"
                  echo "name=${name,,}" >> "$GITHUB_OUTPUT"

            - name: Check package exists
              id: check
              env:
                  OWNER: ${{ steps.pkg.outputs.owner }}
                  NAME: ${{ steps.pkg.outputs.name }}
              run: |
                  for kind in orgs users; do
                    status=$(curl -sS -o /dev/null -w '%{http_code}' \
                      -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                      -H "Accept: application/vnd.github+json" \
                      -H "X-GitHub-Api-Version: 2022-11-28" \
                      "https://api.github.com/${kind}/${OWNER}/packages/container/${NAME}/versions?per_page=1")
                    if [ "$status" = "200" ]; then
                      echo "exists=true" >> "$GITHUB_OUTPUT"
                      echo "owner_kind=${kind}" >> "$GITHUB_OUTPUT"
                      exit 0
                    fi
                  done
                  echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Skip when no GHCR package exists
              if: steps.check.outputs.exists != 'true'
              run: |
                  echo "No container package at ghcr.io/${{ steps.pkg.outputs.owner }}/${{ steps.pkg.outputs.name }}."
                  echo "Run prod/dev CI publish-container-image first, or confirm GHCR package visibility."

            - name: Prune untagged container images
              if: steps.check.outputs.exists == 'true'
              uses: vlaurin/action-ghcr-prune@v0.6.0
              with:
                  token: ${{ github.token }}
                  organization: ${{ steps.check.outputs.owner_kind == 'orgs' && steps.pkg.outputs.owner || '' }}
                  user: ${{ steps.check.outputs.owner_kind == 'users' && steps.pkg.outputs.owner || '' }}
                  container: ${{ steps.pkg.outputs.name }}
                  dry-run: false
                  prune-untagged: true

            - name: Prune tagged container images
              if: steps.check.outputs.exists == 'true'
              uses: vlaurin/action-ghcr-prune@v0.6.0
              with:
                  token: ${{ github.token }}
                  organization: ${{ steps.check.outputs.owner_kind == 'orgs' && steps.pkg.outputs.owner || '' }}
                  user: ${{ steps.check.outputs.owner_kind == 'users' && steps.pkg.outputs.owner || '' }}
                  container: ${{ steps.pkg.outputs.name }}
                  dry-run: false
                  keep-younger-than: 14
                  keep-last: 10
                  keep-tags-regexes: |
                      ^v(\d+)
                      ^develop$
                      ^main$
                      ^latest$
                  prune-tags-regexes: .*
